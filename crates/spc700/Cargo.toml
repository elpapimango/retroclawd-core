[package]
name = "rc-spc700"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/elpapimango/retroclawd-core"
readme = "../../README.md"
description = "Sony SPC700 CPU core (the SNES sound processor), with a disassembler"

[lib]
name = "spc700"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
