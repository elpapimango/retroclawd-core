[package]
# "68000" isn't a legal Rust identifier, so the crate is "mc68000" -- the
# directory stays `crates/core/68000`, like `crates/core/6502` / `mos6502`.
name = "rc-mc68000"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/elpapimango/retroclawd-core"
readme = "../../README.md"
description = "Motorola MC68000 CPU core: instruction set, exceptions, a function-code-aware bus and a disassembler"

[lib]
name = "mc68000"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
flate2 = "1"
# Differential oracle only (MIT); never a dependency of the core.
m68k = "=0.14.6"
