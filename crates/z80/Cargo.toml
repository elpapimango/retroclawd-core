[package]
name = "rc-z80"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Zilog Z80 CPU core with documented and undocumented behaviour (retroclawd)"
repository = "https://github.com/elpapimango/retroclawd-core"
readme = "../../README.md"

[lib]
name = "z80"

[dependencies]
machine = { package = "rc-machine", path = "../machine", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
bincode = { version = "2", features = ["serde"] }
