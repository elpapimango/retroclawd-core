[package]
# "6502" isn't a legal Rust identifier (can't start with a digit), so the
# crate itself is "mos6502" -- the directory stays `crates/core/6502` to
# match every other crate's dir-name-mirrors-what-it-is convention.
name = "rc-mos6502"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "NMOS MOS 6502 CPU core (retroclawd)"
repository = "https://github.com/elpapimango/retroclawd-core"
readme = "../../README.md"

[lib]
name = "mos6502"

[dependencies]
machine = { package = "rc-machine", path = "../machine", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
